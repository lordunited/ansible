- name: create pool for glance 
  shell: "{{ item }}"
  with_items:
  - ceph osd pool create glance-images 64 64 replicated
  - ceph osd pool set glance-images size 2
  - ceph osd pool set glance-images min_size 1
  - ceph osd pool application enable glance-images rbd
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph ]
  



- name: Create Ceph user for Cinder
  command: >
    ceph auth get-or-create client.cinder
    mon 'profile rbd'
    osd 'profile rbd pool=volumes, profile rbd pool=cinder-volumes, profile rbd-read-only pool=cinder-volumes'
    mgr 'profile rbd pool=volumes, profile rbd pool=cinder-volumes'
  register: cinder_key
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph ]

- name: Create Ceph user for Glance
  command: >
    ceph auth get-or-create client.glance
    mon 'profile rbd'
    osd 'profile rbd pool=glance-images'
    mgr 'profile rbd pool=glance-images'
  register: glance_key
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph ]

- name: Create Ceph user for Nova
  command: >
    ceph auth get-or-create client.nova
    mon 'profile rbd'
    osd 'profile rbd pool=cinder-volumes, profile rbd-read-only pool=cinder-volumes'
    mgr 'profile rbd pool=cinder-volumes'
  register: nova_key
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph ]


- name: Export Ceph keyrings
  shell: "ceph auth get client.{{ item }} -o /etc/ceph/ceph.client.{{ item }}.keyring"
  loop:
    - cinder
    - glance
    - nova
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph_key ]

- name: Fetch ceph.conf to controller
  fetch:
    src: /etc/ceph/ceph.conf
    dest: /tmp/ceph.conf
    flat: yes
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph ]

- name: Fetch keyrings to controller
  fetch:
    src: "/etc/ceph/ceph.client.{{ item }}.keyring"
    dest: "/tmp/ceph.client.{{ item }}.keyring"
    flat: yes
  loop:
    - cinder
    - glance
    - nova
  when: hostname == "ubuntu-01"
  run_once: true
  tags: [  ceph_key ]


- name: Install Ceph client packages
  apt:
    name:
      - ceph-common
      - python3-rbd
    state: present
  tags: [  ceph ]

- name: Create /etc/ceph directory
  file:
    path: /etc/ceph
    state: directory
    mode: '0755'
  tags: [  ceph ]
  when: ceph == "enabled"

- name: Copy Ceph configuration
  synchronize:
    src: /tmp/ceph.conf
    dest: /etc/ceph/ceph.conf
  delegate_to: "{{ groups['openstack'][0] }}"
  tags: [  ceph ]


- name: Copy computes service configuration
  synchronize:
    src: "/tmp/ceph.client.{{ item }}.keyring"
    dest: "/etc/ceph/ceph.client.{{ item }}.keyring"
  loop:
    - cinder
    - glance
    - nova
  delegate_to: "{{ groups['openstack'][0] }}"
  tags: [  ceph_key ]

- name: Deploy nova secret 
  template:
    src: secret.xml.j2
    dest: /tmp/secret.xml
    owner: nova
    group: nova
    mode: '0640'
  notify: nova_compute_restart
  tags: [  ceph_key ]
  when: 
    - nova_compute == "enabled"

- name: Deploy nova secret 
  template:
    src: secret.xml.j2
    dest: /tmp/secret.xml
    owner: nova
    group: nova
    mode: '0640'
  notify: nova_compute_restart
  tags: [  ceph_key ]
  when: 
    - nova_control == "enabled"



- name: Set Libvirt Secret Value
  shell: |
    virsh secret-define --file /tmp/secret.xml
    virsh secret-set-value --secret {{ rbd_secret_uuid }} --base64 $(cat /etc/ceph/client.nova.key)
  when: nova_compute == "enabled"


- name: Set Libvirt Secret Value
  shell: |
    virsh secret-define --file /tmp/secret.xml
    virsh secret-set-value --secret {{ rbd_secret_uuid }} --base64 $(cat /etc/ceph/client.nova.key)
  when: nova_controll == "enabled"

